var form = document.getElementById('my-form');

form.addEventListener("submit", e => {
  // Prevent form submission
  e.preventDefault();

  // Validate form fields
  var isValid = true;
  var requiredFields = form.querySelectorAll("[required]"); // Select all required fields

  requiredFields.forEach(field => {
    if (!field.value.trim()) {
      isValid = false;
      field.style.border = "2px solid red"; // Highlight invalid fields
    } else {
      field.style.border = "1px solid #0D6938"; // Reset valid fields
    }
  });

  if (!isValid) {
    alert("Please fill in all required fields.");
    return; // Stop form submission
  }

  // Disable the submit button to prevent multiple submissions
  var submitButton = form.querySelector("button[type='submit']");
  submitButton.disabled = true;

  // Proceed with the form submission via fetch
  fetch(form.action, {
    method: "POST",
    body: new FormData(form),
  }).then(response => {
    alert("You have submitted this form.");
    parent.location.reload();
  });
});

</script>
